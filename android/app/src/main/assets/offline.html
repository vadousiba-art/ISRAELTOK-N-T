<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<style>
  html, body { margin: 0; height: 100%; background: #080808; color: #f5f5f5; font-family: system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .mark { font-size: 56px; font-weight: 700; color: #f20d2f; }
  h1 { font-weight: 600; margin: 16px 0 8px; }
  p { color: #999999; max-width: 320px; }
  a { margin-top: 20px; background: #f20d2f; color: #fff; text-decoration: none; font-weight: 600; padding: 14px 28px; border-radius: 999px; }
</style>
</head>
<body>
<main>
  <div class="mark">夜</div>
  <h1>You&rsquo;re offline.</h1>
  <p>YORU needs a connection. Check your network and try again.</p>
  <a id="retry" href="#">Try again</a>
</main>
<script>
  var u = new URLSearchParams(location.search).get("u");
  if (u && /^https:\/\//.test(u)) document.getElementById("retry").href = u;
</script>
</body>
</html>
