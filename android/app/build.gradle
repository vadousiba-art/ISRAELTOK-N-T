plugins {
    id "com.android.application"
}

// The web app this shell opens. Override with: gradle assembleRelease -PitnUrl=https://...
def itnUrl = project.findProperty("itnUrl") ?: "https://yoru-social.vercel.app"

// Release signing comes from android/keystore.properties (never committed):
//   storeFile=/path/to/release.jks
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "com.israeltoknt.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.yoru.social"
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName "1.3.0"
        buildConfigField "String", "APP_URL", "\"${itnUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
            // Sign with both schemes: v1 (JAR) for store upload checkers and
            // older tools, v2 for modern Android.
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
