plugins {
    id "com.android.application"
}

// YORU for Android: the website as a Trusted Web Activity. Chrome renders it
// full screen (no address bar, verified by /.well-known/assetlinks.json), so
// sign-in, uploads, voice and push notifications work exactly as on the web,
// and notifications are shown as YORU's own (Android 13+ asks permission).
//
// Release signing reads android/keystore.properties (never committed):
//   storeFile=/path/to/release.jks
//   storePassword=...
//   keyAlias=...
//   keyPassword=...

def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
def host = project.findProperty("yoruHost") ?: "yoru-social.vercel.app"

android {
    namespace "com.yoru.social"
    compileSdk 36

    defaultConfig {
        applicationId "com.yoru.social"
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName "2.3.0"
        manifestPlaceholders = [
            hostName  : host,
            // Signed-in members go straight to their feed; others to login.
            launchUrl : "https://${host}/login?app=android",
        ]
        resValue "string", "asset_statements",
            "[{ \\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": { \\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${host}\\\" } }]"
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.4"
}
