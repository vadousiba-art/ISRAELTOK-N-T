<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>YORU — Launch Trailer</title>
<script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
</script>
<style>
  @font-face {
    font-family: "Inter";
    src: url("/assets/inter.woff2") format("woff2");
    font-weight: 100 900;
  }
  :root {
    --red: #f20d2f;
    --red2: #ff3550;
    --dark: #a30f25;
  }
  html,
  body {
    margin: 0;
    width: 1080px;
    height: 1920px;
    background: #000;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #000;
  }
  #gl {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1920px;
  }
  .layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  /* Kinetic type */
  .word {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 50% 50%;
    white-space: nowrap;
    font-family: "Inter", sans-serif;
    font-weight: 900;
    letter-spacing: -0.04em;
    color: #fff;
    opacity: 0;
    will-change: transform, opacity, filter;
  }
  .word .slice {
    position: absolute;
    inset: 0;
  }
  .jp {
    font-family: "IPAGothic", "WenQuanYi Zen Hei", sans-serif;
    font-weight: 700;
  }
  .sub {
    position: absolute;
    left: 50%;
    white-space: nowrap;
    font-family: "IPAGothic", "WenQuanYi Zen Hei", sans-serif;
    color: var(--red2);
    letter-spacing: 0.3em;
    opacity: 0;
  }
  /* HUD */
  #hud {
    font-family: ui-monospace, "DejaVu Sans Mono", monospace;
    color: rgba(255, 60, 80, 0.75);
    font-size: 22px;
    letter-spacing: 0.2em;
  }
  #hud .corner {
    position: absolute;
    width: 70px;
    height: 70px;
    border-color: rgba(242, 13, 47, 0.7);
    border-style: solid;
    border-width: 0;
  }
  #hud .tl { left: 48px; top: 64px; border-left-width: 3px; border-top-width: 3px; }
  #hud .tr { right: 48px; top: 64px; border-right-width: 3px; border-top-width: 3px; }
  #hud .bl { left: 48px; bottom: 64px; border-left-width: 3px; border-bottom-width: 3px; }
  #hud .br { right: 48px; bottom: 64px; border-right-width: 3px; border-bottom-width: 3px; }
  #hud .tc { position: absolute; left: 70px; bottom: 150px; }
  #hud .id { position: absolute; right: 70px; top: 150px; text-align: right; }
  #hud .rec { position: absolute; left: 70px; top: 150px; }
  #hud .rec i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--red); margin-right: 12px; vertical-align: 1px; }
  /* Finish */
  #logo {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    filter: drop-shadow(0 0 40px rgba(242, 13, 47, 0.55));
  }
  #tagline {
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: 0.42em;
    color: #f5f5f5;
    opacity: 0;
    padding-left: 0.42em;
  }
  #url {
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 46px;
    letter-spacing: 0.02em;
    color: #fff;
  }
  #url .cursor {
    display: inline-block;
    width: 4px;
    height: 48px;
    margin-left: 6px;
    vertical-align: -8px;
    background: var(--red);
  }
  #url .dom { color: var(--red2); }
  #redline {
    position: absolute;
    left: 50%;
    height: 4px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, var(--red) 25%, #ff6b7d 50%, var(--red) 75%, transparent);
    box-shadow: 0 0 24px var(--red);
    width: 0;
  }
  #flash {
    position: absolute;
    inset: 0;
    opacity: 0;
  }
  #scan {
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0 2px, transparent 2px 5px);
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="scan" class="layer"></div>
  <div id="hud" class="layer">
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="rec"><i></i><span id="hudState">SIGNAL</span></div>
    <div class="id">夜 // YORU</div>
    <div class="tc" id="tc">00:00:00:00</div>
  </div>
  <div id="type" class="layer"></div>
  <div id="finish" class="layer">
    <img id="logo" src="/assets/wordmark.png" alt="YORU 夜" />
    <div id="redline"></div>
    <div id="tagline">THE INTERNET AFTER DARK.</div>
    <div id="url"></div>
  </div>
  <div id="flash" class="layer"></div>
</div>
<script type="module" src="/main.js"></script>
</body>
</html>
