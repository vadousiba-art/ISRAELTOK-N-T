pluginManagement {
    repositories {
        google()
        // Google's mirror of Maven Central first (Central rate-limits shared CI IPs).
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        mavenCentral()
    }
}
rootProject.name = "IsraelToknt"
include ":app"
